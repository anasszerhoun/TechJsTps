<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 py-6">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl font-bold text-slate-800 mb-8 text-center">
            Book Management System
        </h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white shadow-lg rounded-xl p-8">
                <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">
                    Register a New Book
                </h2>

                <form id="book-form" class="space-y-5">
                <div>
                    <label for="title" class="block text-sm font-medium text-slate-700 mb-1">
                        Book Title
                    </label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Enter the book title"
                        required
                    />
                </div>

                <div>
                    <label for="author" class="block text-sm font-medium text-slate-700 mb-1">
                        Author
                    </label>
                    <input
                        type="text"
                        id="author"
                        name="author"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Enter the author name"
                        required
                    />
                </div>

                <div>
                    <label for="pages" class="block text-sm font-medium text-slate-700 mb-1">
                        Number of Pages
                    </label>
                    <input
                        type="number"
                        id="pages"
                        name="pages"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Total pages (e.g. 350)"
                        min="1"
                        required
                    />
                </div>

                <div>
                    <label for="pagesRead" class="block text-sm font-medium text-slate-700 mb-1">
                        Pages Read
                    </label>
                    <input
                        type="number"
                        id="pagesRead"
                        name="pagesRead"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Pages already read (e.g. 150)"
                        min="0"
                    />
                </div>

                <div>
                    <label for="status" class="block text-sm font-medium text-slate-700 mb-1">
                        Status
                    </label>
                    <select
                        id="status"
                        name="status"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        required
                    >
                        <option value="">Select status</option>
                        <option value="Read">Read</option>
                        <option value="Re-read">Re-read</option>
                        <option value="DNF">DNF</option>
                        <option value="Currently reading">Currently reading</option>
                        <option value="Returned Unread">Returned Unread</option>
                        <option value="Want to read">Want to read</option>
                    </select>
                </div>

                <div>
                    <label for="price" class="block text-sm font-medium text-slate-700 mb-1">
                        Price
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-sm">
                            $
                        </span>
                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            id="price"
                            name="price"
                            class="w-full rounded-lg border border-slate-300 pl-7 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                            placeholder="e.g. 19.99"
                            required
                        />
                    </div>
                </div>

                <div>
                    <label for="format" class="block text-sm font-medium text-slate-700 mb-1">
                        Format
                    </label>
                    <select
                        id="format"
                        name="format"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        required
                    >
                        <option value="">Select format</option>
                        <option value="Print">Print</option>
                        <option value="PDF">PDF</option>
                        <option value="Ebook">Ebook</option>
                        <option value="AudioBook">AudioBook</option>
                    </select>
                </div>

                <div>
                    <label for="suggestedBy" class="block text-sm font-medium text-slate-700 mb-1">
                        Suggested by
                    </label>
                    <input
                        type="text"
                        id="suggestedBy"
                        name="suggestedBy"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Friend, teacher, website..."
                    />
                </div>

                <div class="flex items-center gap-2">
                    <input
                        id="finished"
                        name="finished"
                        type="checkbox"
                        class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
                    />
                    <label for="finished" class="text-sm text-slate-700">
                        Finished reading this book
                    </label>
                </div>

                <div class="pt-2">
                    <button
                        type="submit"
                        class="w-full inline-flex justify-center items-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
                    >
                        Register Book
                    </button>
                </div>
            </form>
            </div>

            <div class="bg-white shadow-lg rounded-xl p-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-800">
                        Books List
                    </h2>
                    <button
                        id="refresh-btn"
                        class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-semibold"
                    >
                        Refresh
                    </button>
                </div>
                
                <div id="books-list" class="space-y-4 max-h-[calc(100vh-200px)] overflow-y-auto">
                    <p class="text-slate-500 text-center py-8">Chargement des livres...</p>
                </div>
            </div>
        </div>
    </div>
</body>
<script type="module" src="script.js"></script>
</html>
